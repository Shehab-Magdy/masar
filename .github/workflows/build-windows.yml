name: Build Windows exe

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build exe
        shell: pwsh
        run: |
          # attachments/ is gitignored (real employee data) so a fresh checkout never has it;
          # ship an empty one so the installer starts clean, matching the documented build command.
          New-Item -ItemType Directory -Force -Path attachments | Out-Null

          $pyArgs = @(
            "--onefile", "--windowed",
            "--name", "Masar",
            "--icon", "assets/icons/masar.ico",
            "--add-data", "assets;assets",
            "--add-data", "config.json;.",
            "--add-data", "utils/pdf_bg_utils.py;.",
            "--add-data", "attachments;attachments"
          )
          $pyArgs += "main.py"
          pyinstaller @pyArgs

      - name: Zip exe with password
        shell: pwsh
        env:
          ZIP_PASSWORD: ${{ secrets.ZIP_PASSWORD }}
        run: |
          if ([string]::IsNullOrEmpty($env:ZIP_PASSWORD)) {
            throw "ZIP_PASSWORD secret is not set"
          }
          & "C:\Program Files\7-Zip\7z.exe" a -tzip -mem=AES256 "-p$env:ZIP_PASSWORD" dist/Masar.zip dist/Masar.exe

      - uses: actions/upload-artifact@v4
        with:
          name: Masar
          path: dist/Masar.zip
