name: Build Windows exe

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Pango (WeasyPrint's native dependency on Windows)
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: mingw-w64-x86_64-pango
          update: true
          release: false

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build exe
        shell: pwsh
        run: |
          # attachments/ is gitignored (real employee data) so a fresh checkout never has it;
          # ship an empty one so the installer starts clean, matching the documented build command.
          New-Item -ItemType Directory -Force -Path attachments | Out-Null

          $pyArgs = @(
            "--onefile", "--windowed",
            "--name", "Masar",
            "--icon", "assets/icons/masar.ico",
            "--add-data", "assets;assets",
            "--add-data", "config.json;.",
            "--add-data", "license.json;.",
            "--add-data", "utils/pdf_bg_utils.py;.",
            "--add-data", "attachments;attachments"
          )
          # Bundle Pango/cairo/fontconfig/etc DLLs that WeasyPrint loads at runtime via ctypes,
          # so the exe doesn't depend on the end user having MSYS2/GTK installed.
          $pyArgs += (Get-ChildItem "C:\msys64\mingw64\bin\*.dll").FullName | ForEach-Object { "--add-binary=${_};." }
          $pyArgs += "main.py"
          pyinstaller @pyArgs

      - uses: actions/upload-artifact@v4
        with:
          name: Masar
          path: dist/Masar.exe
